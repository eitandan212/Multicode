# Inactive template. To turn it on, move it to .github/workflows/release.yml.
# Builds the Windows installer and publishes it on GitHub Releases whenever the version in
# package.json changes, then points downloads/latest.json (what the in-app updater reads) at it.
# The installer no longer has to live in the repository (GitHub caps files at 100 MB).
name: Release

on:
  push:
    branches: [claude/bold-ptolemy-blicd7]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Build the installer
        if: steps.v.outputs.exists == 'false'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          npm ci
          npm run dist:win
        env:
          RELEASE_URL_BASE: https://github.com/${{ github.repository }}/releases/download

      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        run: |
          v=${{ steps.v.outputs.version }}
          sha=$(node -p "require('./release/latest.json').sha256")
          gh release create "v$v" "release/MultiCode-Setup-$v.exe" \
            --target "$GITHUB_SHA" --title "MultiCode $v" \
            --notes "Windows installer. SHA-256: \`$sha\`"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Point the updater at it
        if: steps.v.outputs.exists == 'false'
        run: |
          cp release/latest.json downloads/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add downloads/latest.json
          git commit -m "Update feed to ${{ steps.v.outputs.version }} on GitHub Releases"
          git push
